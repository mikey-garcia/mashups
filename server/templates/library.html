<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><main><h1>Shnatty Mash</h1><p class="muted">Private mashup library</p>{% for t in tracks %}<article><div><strong>{{t.title}}</strong><small>{{t.artist}}</small></div><a class="button" href="/track/{{t.id}}/audio">Add to Spotify</a></article>{% else %}<p>No tracks yet.</p>{% endfor %}<details><summary>iPhone setup</summary><p>Enable Local Files in Spotify. Download the track, then move it in Files to On My iPhone → Spotify. Spotify will index it under Local Files.</p></details></main>
